Objectif: |
  Configurer Meilisearch pour stocker et indexer les données de films, séries TV, épisodes et personnes avec une recherche full-text performante et des filtres avancés.

Contexte:
  - Base de données : Meilisearch (version 1.x)
  - Langage : Node.js avec TypeScript
  - Indexes : movies, showtv, episodes, persons
  - Fonctionnalités : Recherche full-text, filtres, tri, facettes

Architecture_des_indexes: |
  Index `movies` (Films et Documentaires)

  MovieDocument {
    id: string;                    // identifiant uuid v4
    title: string;                 // Titre du film
    overview: string;              // Synopsis
    genres: string[];              // Liste des genres
    release_date: string;          // Date de sortie (ISO 8601)
    revenue: number;               // Recettes
    runtime: number;               // Temps de la vidéo (minutes)
    tagline: string;               // Accroche
    vote_average: number;          // Moyenne des votes (0-10)
    vote_count: number;            // Nombre de votes
    spoken_languages: string;      // Langage de la vidéo
    production_countries: string;  // Pays d'origine
    production_companies: string[]; // Name, logo, pays
    imdb_id: string;               // identifiant imdb
    budget: number;                // Budget
    backdrops: string[];           // Liste des 3 backdrops avec largeur >= 1920
    posters: string[];             // Récupération de 2 posters avec iso_639_1 'en' et 'fr'
    videos: string[];              // Récupération de 2 videos avec iso_639_1 'en' et 'fr'
    keywords: string[];            // Liste de mots clés
    videos_link: string[];         // Liste des urls de videos
  }

  Configuration des attributs `movies`

  {
    searchableAttributes: ['title', 'overview', 'genres'],
    filterableAttributes: ['type', 'genres', 'rating'],
    sortableAttributes: ['release_date', 'vote_average', 'vote_count']
  }

  Index `showtv` (Séries)

  ShowTvDocument {
    id: string;                    // identifiant uuid v4
    title: string;                 // Titre de la série
    air_date: string;              // Date de diffusion (ISO 8601)
    overview: string;              // Synopsis
    networks: string;              // Producteurs/Réseaux
    poster_path: string;           // Image du poster
    season_number: number;         // Numéro de la saison
    genres: string[];              // Liste des genres
    vote_average: number;          // Moyenne des votes
    vote_count: number;            // Nombre de votes
    first_air_date: string;        // Date de première diffusion
    last_air_date: string;         // Date de fin (si applicable)
    status: string;                // Statut (En cours, Terminé, etc.)
    number_of_seasons: number;     // Nombre de saisons
    number_of_episodes: number;    // Nombre d'épisodes
    created_by: string[];          // Créateurs
    production_companies: string[]; // Sociétés de production
  }

  Configuration des attributs `showtv`

  {
    searchableAttributes: ['title', 'overview', 'genres'],
    filterableAttributes: ['type', 'genres', 'vote_average', 'status'],
    sortableAttributes: ['air_date', 'first_air_date', 'vote_average']
  }

  Index `episodes`

  EpisodeDocument {
    id: string;                    // identifiant uuid v4
    showtv_id: string;             // identifiant de la série parente
    air_date: string;              // date de diffusion (ISO 8601)
    episode_number: number;        // numéro de l'épisode
    name: string;                  // titre de l'épisode
    overview: string;              // synopsis
    runtime: number;               // Durée de l'épisode (minutes)
    vote_average: number;          // Moyenne des votes
    vote_count: number;            // Nombre de votes
    season_number: number;         // Numéro de la saison
    still_path: string;            // Récupération d'une image (file_path)
    videos_link: string[];         // Liste des urls de videos
  }

  Configuration des attributs `episodes`

  {
    searchableAttributes: ['name', 'overview'],
    filterableAttributes: ['showtv_id', 'season_number', 'episode_number'],
    sortableAttributes: ['season_number', 'episode_number', 'air_date']
  }

  Index `persons`

  PersonDocument {
    id: string;                    // identifiant uuid v4
    name: string;                  // Nom de la personne
    gender: string;                // genre de la personne (0: Unknown, 1: Female, 2: Male)
    place_of_birth: string;        // lieu de naissance
    profile_path: string;          // image du portrait
    birthday: string;              // date de naissance (ISO 8601)
    deathday: string | null;       // date de mort (null si vivant)
    biography: string;             // biographie
    known_for_department: string;  // Département connu (Acting, Directing, etc.)
    known_for: string[];           // Liste des IDs des médias connus
    popularity: number;            // Popularité
  }

  Configuration des attributs `persons`

  {
    searchableAttributes: ['name', 'biography'],
    filterableAttributes: ['gender', 'known_for_department'],
    sortableAttributes: ['popularity', 'birthday']
  }

etapes:
  # Étape 1 : Installation des dépendances
  - nom: install-dependencies
    description: Installer les packages nécessaires

  # Étape 2 : Configuration de l'environnement
  - nom: create-env
    description: Créer le fichier de configuration environnement

  # Étape 3 : Création du client Meilisearch
  - nom: create-client
    description: Créer le fichier client Meilisearch

  # Étape 4 : Définition des interfaces TypeScript
  - nom: create-types
    description: Créer les interfaces TypeScript pour les documents

  # Étape 5 : Configuration des paramètres Meilisearch
  - nom: create-settings
    description: Créer la configuration des attributs de recherche/filtrage/tri

  # Étape 6 : Création et configuration des indexes
  - nom: create-indexes
    description: Créer les 4 indexes avec leur configuration

  # Étape 7 : Script d'initialisation
  - nom: create-init-script
    description: Créer le script d'initialisation de Meilisearch

  # Étape 9 : Configuration TypeScript
  - nom: create-tsconfig
    description: Créer la configuration TypeScript

  # Étape 10 : Script de suppression des indexes (utilitaire)
  - nom: create-delete-script
    description: Créer le script de suppression des indexes

contraintes:
  - La clé maître Meilisearch doit être définie dans le fichier .env
  - Les indexes seront créés automatiquement s'ils n'existent pas
  - La configuration des attributs (searchable, filterable, sortable) est appliquée lors de la création
  - Utiliser `npm run meilisearch:delete` pour supprimer tous les indexes (mode développement uniquement)
  - Les UUID v4 doivent être générés lors de l'ajout des documents, pas lors de la création des indexes

